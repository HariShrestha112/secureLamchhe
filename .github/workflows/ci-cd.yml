name: CI/CD Build and (optional) Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production || npm run build

      - name: Copy frontend into backend and package
        run: |
          rm -rf backend/src/main/resources/static || true
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/frontend/* backend/src/main/resources/static/
          mvn -DskipTests -f backend/pom.xml package

      - name: Upload artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # Optional deploy step (example using SSH). Configure secrets: DEPLOY_HOST, DEPLOY_USER, SSH_PRIVATE_KEY
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: false # disabled by default; enable when you add secrets
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      - name: Deploy to host via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p /opt/securelamchhe
            mv backend-1.0.0-SNAPSHOT.jar /opt/securelamchhe/app.jar
            sudo systemctl daemon-reload || true
            sudo systemctl restart securelamchhe || true
